<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TutorGrace - Workstation</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08090d;--surface:#10131a;--surface2:#181c26;--surface3:#1f2433;
  --border:#ffffff0f;--border2:#ffffff1a;--border3:#ffffff28;
  --accent:#00e5a0;--accent2:#00b37d;--accent-dim:#00e5a020;
  --danger:#ff4d6d;--danger-dim:#ff4d6d18;
  --warn:#ffb347;--warn-dim:#ffb34718;
  --info:#4d9fff;--info-dim:#4d9fff18;
  --text:#dde3ef;--text2:#8892a4;--text3:#4e5a6e;
  --mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
  --r:14px;--r2:9px;--r3:6px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;overflow-x:hidden}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border3);border-radius:4px}
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:52px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;gap:10px}
.logo{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap;letter-spacing:.5px}
.logo em{color:var(--text3);font-style:normal}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;padding:4px 9px;border-radius:20px;border:1px solid var(--border2);color:var(--text3);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0}
.dot.green{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.dot.yellow{background:var(--warn)}
.dot.red{background:var(--danger)}
.dot.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.deriv-bar{display:flex;align-items:center;gap:10px;padding:8px 18px;background:var(--surface2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.deriv-bar input{background:var(--surface3);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:12px;border-radius:var(--r3);padding:6px 10px;width:200px;outline:none;transition:border .2s}
.deriv-bar input:focus{border-color:var(--accent)}
.deriv-bar label{font-size:11px;color:var(--text3);white-space:nowrap}
.nav{display:flex;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--border);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{flex-shrink:0;padding:10px 16px;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--text3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .2s;white-space:nowrap}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.nav-btn:hover:not(.active){color:var(--text)}
.main{flex:1;padding:16px;max-width:960px;margin:0 auto;width:100%}
.tab{display:none}.tab.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card-title{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title span{flex:1}
input[type=text],input[type=number],input[type=password],input[type=date],select,textarea{background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-family:var(--sans);font-size:14px;border-radius:var(--r2);padding:9px 12px;width:100%;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
label{font-size:12px;color:var(--text2);margin-bottom:5px;display:block;font-weight:500}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 15px;border-radius:var(--r2);border:none;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{background:var(--accent2)}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:var(--surface2);color:var(--text2);border:1px solid var(--border2)}
.btn-ghost:hover{color:var(--text);border-color:var(--border3)}
.btn-sm{padding:5px 11px;font-size:12px}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:580px){.metrics{grid-template-columns:repeat(4,1fr)}}
.metric{background:var(--surface2);border-radius:var(--r2);padding:12px;border:1px solid var(--border)}
.metric-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;font-family:var(--mono)}
.metric-value{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--text);line-height:1}
.metric-sub{font-size:10px;color:var(--text3);margin-top:3px}
.v-pos{color:var(--accent)}.v-neg{color:var(--danger)}.v-warn{color:var(--warn)}
.status-bar{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--r2);margin-bottom:12px;font-size:13px;font-weight:600}
.s-ok{background:var(--accent-dim);border:1px solid #00e5a030;color:var(--accent)}
.s-warn{background:var(--warn-dim);border:1px solid #ffb34730;color:var(--warn)}
.s-danger{background:var(--danger-dim);border:1px solid #ff4d6d30;color:var(--danger)}
.tbl-wrap{overflow-x:auto;border-radius:var(--r2);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:540px}
th{background:var(--surface2);padding:8px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;border-bottom:1px solid var(--border)}
td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#ffffff04}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;font-family:var(--mono)}
.b-stop{background:var(--danger-dim);color:var(--danger);border:1px solid #ff4d6d30}
.b-ok{background:var(--accent-dim);color:var(--accent);border:1px solid #00e5a030}
.calc-block{background:var(--surface2);border-radius:var(--r2);padding:14px;margin-top:12px;border:1px solid var(--border)}
.calc-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border)}
.calc-row:last-child{border-bottom:none}
.calc-row .k{color:var(--text2)}
.calc-row .v{font-family:var(--mono);font-weight:700;color:var(--accent);font-size:15px}
.health-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.hitem{background:var(--surface2);border-radius:var(--r2);padding:14px 8px;text-align:center;border:1px solid var(--border);cursor:pointer;transition:all .2s;user-select:none}
.hitem.done{border-color:var(--accent);background:var(--accent-dim)}
.hitem .ico{font-size:24px;margin-bottom:4px}
.hitem .hl{font-size:11px;color:var(--text2)}
.overlay{position:fixed;inset:0;background:#000b;z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:20px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto}
.modal-title{font-family:var(--mono);font-size:11px;color:var(--accent);margin-bottom:16px;text-transform:uppercase;letter-spacing:1px}
.modal-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.toasts{position:fixed;bottom:20px;right:18px;z-index:999;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{padding:9px 15px;background:var(--surface3);border:1px solid var(--border2);border-radius:var(--r2);font-size:13px;color:var(--text);animation:tin .25s ease;pointer-events:all}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.live-feed{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r2);max-height:160px;overflow-y:auto;padding:8px;margin-bottom:12px}
.feed-row{font-family:var(--mono);font-size:11px;color:var(--text3);padding:3px 0;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center}
.feed-time{color:var(--text3);flex-shrink:0}
.feed-msg{color:var(--text2);flex:1}
.feed-row.win .feed-msg{color:var(--accent)}
.feed-row.loss .feed-msg{color:var(--danger)}
.deriv-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.empty{text-align:center;padding:28px;color:var(--text3);font-size:13px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">TUTOR<em>/</em>GRACE</div>
    <div class="topbar-right">
      <button id="btn-panico" class="btn btn-danger btn-sm" onclick="activarPanicoWeb()">🚨 PÁNICO</button>
      <div class="pill" id="deriv-pill"><div class="dot" id="deriv-dot"></div><span id="deriv-status-txt">Deriv: off</span></div>
      <div class="pill"><div class="dot green pulse" id="fb-dot"></div><span id="fb-status-txt">Firebase</span></div>
      <div class="pill" id="room-pill">Sala: <span id="room-short">8uyj1ci8qm</span></div>
    </div>
  </div>

  <div class="deriv-bar">
    <div style="display:flex;flex-direction:column;gap:2px">
      <label>API Token Deriv (Real)</label>
      <input type="password" id="deriv-token" placeholder="Pega tu token aquí..." autocomplete="off">
    </div>
    <button class="btn btn-primary btn-sm" onclick="connectDeriv()">⚡ Conectar</button>
    <div id="deriv-account-info" style="font-size:12px;color:var(--text2)"></div>
  </div>

  <nav class="nav">
    <button class="nav-btn active" onclick="switchTab('bitacora',this)">📋 Operativa</button>
  </nav>

  <div class="main">
    <div id="tab-bitacora" class="tab active">
      <div class="card">
        <div class="card-title"><span>Configuración de Riesgo Diario</span></div>
        <div class="form-row">
          <div><label>Saldo Inicial ($)</label><input type="number" id="b-saldo" placeholder="1000" step="0.01"></div>
          <div><label>Meta Pérdida (%)</label><input type="number" id="b-meta-perd" placeholder="1" step="0.1"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><span>Deriv — En vivo</span></div>
        <div class="deriv-stats">
          <div class="metric"><div class="metric-label">Balance</div><div class="metric-value" id="dv-balance">—</div></div>
          <div class="metric"><div class="metric-label">Profit Hoy</div><div class="metric-value" id="dv-profit-dia">$0.00</div></div>
          <div class="metric"><div class="metric-label">Pérdida Hoy</div><div class="metric-value" id="dv-loss-dia">$0.00</div></div>
        </div>
        <div class="live-feed" id="live-feed"></div>
      </div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// REEMPLAZA CON TUS CREDENCIALES WEB DE FIREBASE
const firebaseConfig = {
   apiKey: "AIzaSyB4SQmFiLcPu_CELfWn6RGemDGv1pd-ow8",
  authDomain: "tutor-d4b91.firebaseapp.com",
  projectId: "tutor-d4b91",
  storageBucket: "tutor-d4b91.firebasestorage.app",
  messagingSenderId: "95935472611",
  appId: "1:95935472611:web:abdb23f636766c4e0536d6",
  measurementId: "G-YR8NNG6W36"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const room = "8uyj1ci8qm"; 
window._ops = [];

function rdoc(p){ return doc(db,'rooms',room,p); }
function rcol(p){ return collection(db,'rooms',room,p); }

window.toast = (msg) => {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>t.remove(), 4000);
};

// ACTIVACIÓN DE PÁNICO MANUAL DESDE LA WEB
window.activarPanicoWeb = async () => {
  await setDoc(rdoc('config/lockdown'), {
    active: true,
    unlock_at: Date.now() + (2 * 3600 * 1000), // 2 horas
    reason: "Pánico manual activado"
  });
  toast('🚨 PÁNICO ACTIVADO: Bloqueando MT5');
};

const WS_URL = 'wss://ws.binaryws.com/websockets/v3?app_id=310893';
let ws = null, _profitHoy = 0, _lossHoy = 0;

window.connectDeriv = function(){
  const token = document.getElementById('deriv-token').value.trim();
  if(!token) return;
  ws = new WebSocket(WS_URL);
  ws.onopen = ()=> ws.send(JSON.stringify({ authorize: token }));
  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if(msg.msg_type==='authorize'){
      ws.send(JSON.stringify({ transaction: 1, subscribe: 1 }));
    }
    if(msg.msg_type==='transaction'){
      const t = msg.transaction;
      if(t.action==='sell' || t.action==='buy') handleDerivTrade(t);
    }
  };
};

function handleDerivTrade(t){
  const profit = parseFloat(t.amount||0);
  const symbol = t.symbol || 'Deriv';
  registerDerivOp({ profit, symbol, ts: Date.now(), derivId: t.transaction_id });
}

async function registerDerivOp({profit, symbol, ts, derivId}){
  if(profit > 0) _profitHoy += profit;
  else _lossHoy += Math.abs(profit);
  
  const saldo = parseFloat(document.getElementById('b-saldo').value)||0;
  const metaperd = parseFloat(document.getElementById('b-meta-perd').value)||1;
  const mPerd = saldo * metaperd / 100;
  const currentPnl = _profitHoy - _lossHoy;
  const parar = currentPnl <= -mPerd ? 'SI' : 'NO';

  // EL CEREBRO: LA INYECCIÓN QUE BLOQUEA TU MT5
  if(parar === 'SI') {
    await setDoc(rdoc('config/lockdown'), {
      active: true,
      unlock_at: Date.now() + (2 * 3600 * 1000),
      reason: "Límite de pérdida alcanzado"
    });
    toast('🚨 MODO REGULACIÓN: Guardián activado');
  }
}
</script>
</body>
</html>
