<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TutorGrace - Workstation</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08090d;--surface:#10131a;--surface2:#181c26;--surface3:#1f2433;
  --border:#ffffff0f;--border2:#ffffff1a;--border3:#ffffff28;
  --accent:#00e5a0;--accent2:#00b37d;--accent-dim:#00e5a020;
  --danger:#ff4d6d;--danger-dim:#ff4d6d18;
  --warn:#ffb347;--warn-dim:#ffb34718;
  --info:#4d9fff;--info-dim:#4d9fff18;
  --text:#dde3ef;--text2:#8892a4;--text3:#4e5a6e;
  --mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
  --r:14px;--r2:9px;--r3:6px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;overflow-x:hidden}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border3);border-radius:4px}
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:52px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;gap:10px}
.logo{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap;letter-spacing:.5px}
.logo em{color:var(--text3);font-style:normal}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;padding:4px 9px;border-radius:20px;border:1px solid var(--border2);color:var(--text3);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0}
.dot.green{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.dot.yellow{background:var(--warn)}
.dot.red{background:var(--danger)}
.dot.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.nav{display:flex;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--border);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{flex-shrink:0;padding:10px 16px;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--text3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .2s;white-space:nowrap}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.nav-btn:hover:not(.active){color:var(--text)}
.main{flex:1;padding:16px;max-width:960px;margin:0 auto;width:100%}
.tab{display:none}.tab.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card-title{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title span{flex:1}
input[type=text],input[type=number],input[type=password],input[type=date],select,textarea{background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-family:var(--sans);font-size:14px;border-radius:var(--r2);padding:9px 12px;width:100%;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
label{font-size:12px;color:var(--text2);margin-bottom:5px;display:block;font-weight:500}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 15px;border-radius:var(--r2);border:none;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-sm{padding:5px 11px;font-size:12px}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:580px){.metrics{grid-template-columns:repeat(4,1fr)}}
.metric{background:var(--surface2);border-radius:var(--r2);padding:12px;border:1px solid var(--border)}
.metric-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;font-family:var(--mono)}
.metric-value{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--text);line-height:1}
.v-pos{color:var(--accent)}.v-neg{color:var(--danger)}.v-warn{color:var(--warn)}
.toasts{position:fixed;bottom:20px;right:18px;z-index:999;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{padding:9px 15px;background:var(--surface3);border:1px solid var(--border2);border-radius:var(--r2);font-size:13px;color:var(--text);animation:tin .25s ease;pointer-events:all}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.live-feed{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r2);max-height:160px;overflow-y:auto;padding:8px;margin-bottom:12px}
.feed-row{font-family:var(--mono);font-size:11px;color:var(--text3);padding:3px 0;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center}
.feed-time{color:var(--text3);flex-shrink:0}
.feed-msg{color:var(--text2);flex:1}
.feed-row.win .feed-msg{color:var(--accent)}
.feed-row.loss .feed-msg{color:var(--danger)}
.feed-row.info .feed-msg{color:var(--info)}
.deriv-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">TUTOR<em>/</em>GRACE</div>
    <div class="topbar-right">
      <button id="btn-selah" class="btn btn-sm" style="background:var(--warn); color:#000; font-weight:bold;" onclick="activarSelah('Selah: Pausa reflexiva manual')">🛑 SELAH</button>
      <div class="pill" id="mt5-pill"><div class="dot" id="mt5-dot"></div><span id="mt5-status-txt">MT5: Esperando</span></div>
      <div class="pill"><div class="dot green pulse" id="fb-dot"></div><span id="fb-status-txt">Firebase</span></div>
      <div class="pill" id="room-pill">Sala: <span id="room-short">8uyj1ci8qm</span></div>
    </div>
  </div>

  <nav class="nav">
    <button class="nav-btn active" onclick="switchTab('bitacora',this)">📋 Operativa MT5</button>
  </nav>

  <div class="main">
    <div id="tab-bitacora" class="tab active">
      <div class="card">
        <div class="card-title"><span>Configuración de Riesgo Diario</span></div>
        <div class="form-row">
          <div><label>Saldo Inicial ($)</label><input type="number" id="b-saldo" placeholder="1000" step="0.01" oninput="evaluarLimites()"></div>
          <div><label>Meta Pérdida (%)</label><input type="number" id="b-meta-perd" placeholder="1" step="0.1" oninput="evaluarLimites()"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><span>MetaTrader — En vivo</span></div>
        <div class="deriv-stats">
          <div class="metric"><div class="metric-label">Balance MT5</div><div class="metric-value" id="dv-balance">—</div></div>
          <div class="metric"><div class="metric-label">Profit Hoy</div><div class="metric-value" id="dv-profit-dia">$0.00</div></div>
          <div class="metric"><div class="metric-label">Pérdida Hoy</div><div class="metric-value" id="dv-loss-dia">$0.00</div></div>
        </div>
        <div class="live-feed" id="live-feed">
          <div class="feed-row info"><span class="feed-time">--:--</span><span class="feed-msg">Esperando conexión con MetaTrader...</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, collection, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Credenciales correctas de tu proyecto Tutor
const firebaseConfig = {
   apiKey: "AIzaSyB7DKpMIT6Quw2psRpMxjHzoUCXwmEnhj0",
  authDomain: "station-trading-grace.firebaseapp.com",
  databaseURL: "https://station-trading-grace-default-rtdb.firebaseio.com",
  projectId: "station-trading-grace",
  storageBucket: "station-trading-grace.firebasestorage.app",
  messagingSenderId: "1075471867622",
  appId: "1:1075471867622:web:707ede01361dadc2676527",
  measurementId: "G-6FJRW3CBPV"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const room = "8uyj1ci8qm"; 
window._ops = [];
let _mt5Timeout = null;

function rdoc(p){ return doc(db,'rooms',room,p); }
function rcol(p){ return collection(db,'rooms',room,p); }

window.toast = (msg) => {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>t.remove(), 4000);
};

window.switchTab = (name, btn) => {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
};

// ACTIVACIÓN DE SELAH MANUAL DESDE LA WEB
window.activarSelah = async (razon) => {
  await setDoc(rdoc('config/lockdown'), {
    active: true,
    unlock_at: Date.now() + (2 * 3600 * 1000), 
    reason: razon
  });
  toast('🛑 ' + razon);
};

// LISTENERS DE FIREBASE PARA MT5
function setupListeners() {
  onSnapshot(rdoc('account/estado'), s => {
    if(s.exists()) updateMT5(s.data());
  });

  onSnapshot(query(rcol('ops'), orderBy('ts')), s => {
    window._ops = s.docs.map(d => ({id: d.id, ...d.data()}));
    window.evaluarLimites();
  });
}

function updateMT5(d) {
  clearTimeout(_mt5Timeout);
  document.getElementById('mt5-dot').className = 'dot green pulse';
  document.getElementById('mt5-status-txt').textContent = 'MT5: Online';
  
  document.getElementById('dv-balance').textContent = '$' + parseFloat(d.balance||0).toFixed(2);
  
  const curTime = new Date().toLocaleTimeString('es', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  feedLog('info', `Latido MT5 -> Balance: $${parseFloat(d.balance||0).toFixed(2)} | Equidad: $${parseFloat(d.equity||0).toFixed(2)}`);

  _mt5Timeout = setTimeout(() => {
    document.getElementById('mt5-dot').className = 'dot red pulse';
    document.getElementById('mt5-status-txt').textContent = 'MT5: Offline';
  }, 45000);
}

window.evaluarLimites = async () => {
  let profitHoy = 0, lossHoy = 0;
  
  // Filtrar operaciones de hoy
  const hoyStr = new Date().toISOString().slice(0,10);
  const opsHoy = window._ops.filter(o => {
      if(!o.ts) return false;
      const f = new Date(parseInt(o.ts)).toISOString().slice(0,10);
      return f === hoyStr;
  });

  opsHoy.forEach(o => {
    const r = parseFloat(o.result||0);
    if(r > 0) profitHoy += r;
    else lossHoy += Math.abs(r);
  });

  document.getElementById('dv-profit-dia').textContent = '$' + profitHoy.toFixed(2);
  document.getElementById('dv-loss-dia').textContent = '$' + lossHoy.toFixed(2);

  const saldo = parseFloat(document.getElementById('b-saldo').value)||0;
  const metaperd = parseFloat(document.getElementById('b-meta-perd').value)||1;
  
  if (saldo > 0) {
    const mPerd = saldo * metaperd / 100;
    const currentPnl = profitHoy - lossHoy;

    if(currentPnl <= -mPerd && currentPnl < 0) {
      await activarSelah("Límite de pérdida alcanzado. Guardián activado.");
    }
  }
};

function feedLog(type, msg) {
  const feed = document.getElementById('live-feed');
  const now = new Date().toLocaleTimeString('es', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  const row = document.createElement('div');
  row.className = `feed-row ${type}`;
  row.innerHTML = `<span class="feed-time">${now}</span><span class="feed-msg">${msg}</span>`;
  feed.prepend(row);
  while(feed.children.length > 50) feed.removeChild(feed.lastChild);
}

// Inicializar conexión
setupListeners();

</script>
</body>
</html>
